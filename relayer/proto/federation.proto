syntax = "proto3";

// Federation signature exchange (Phase 7c, ADR-0016).
//
// This service moves SIGNATURES, never truth. A responder never trusts the
// requester's description of the world: it independently re-derives the
// canonical bytes from its OWN chain observations and refuses to sign
// anything that does not match byte for byte. A compromised requester
// therefore cannot induce a signature over anything the responder has not
// itself verified.
package glc.federation.v1;

service FederationSigner {
  // Requests this validator's signature over a canonical message it must
  // independently re-derive and agree with.
  rpc Sign(SignRequest) returns (SignResponse);

  // Requests this validator's PARTIAL Goldcoin signature for a vault payout
  // (Phase 7e, ADR-0017).
  //
  // Deliberately separate from Sign rather than folded into it: Sign
  // returns ONE ed25519 signature over a canonical message, while this
  // returns ONE DER-encoded secp256k1 ECDSA signature PER TRANSACTION INPUT
  // over Goldcoin sighashes. Overloading one response shape to mean both
  // would remove the type system's help exactly where the two must never be
  // confused.
  rpc SignPayout(PayoutSignRequest) returns (PayoutSignResponse);

  // Liveness and identity probe, used to decide quorum availability BEFORE
  // designating one (ADR-0015: reassignment must be explicit, so the
  // executor prefers to designate a quorum it believes is reachable).
  rpc Health(HealthRequest) returns (HealthResponse);
}

// What is being asked for. Action discriminants match the on-chain
// canonical-message action bytes so a signature can never be repurposed
// across action types.
enum Action {
  ACTION_UNSPECIFIED = 0;   // never valid
  ACTION_MINT_DEPOSIT = 1;  // shared::claim::ACTION_MINT_DEPOSIT
  ACTION_PAYOUT = 2;        // Goldcoin vault payout (ADR-0015 intent)
  ACTION_GOVERNANCE = 3;    // shared::governance
}

message SignRequest {
  // Unique per request; makes a retry distinguishable from a fresh ask.
  bytes request_id = 1;
  Action action = 2;
  // The validator-set epoch the requester believes is current. A responder
  // whose own view disagrees refuses rather than signing under a stale
  // federation.
  uint64 epoch = 3;
  // The exact bytes the requester wants signed. CHECKED, never trusted:
  // the responder re-derives them and compares.
  bytes canonical_message = 4;
  // Identifiers letting the responder locate the same facts in its own
  // state in order to re-derive `canonical_message`.
  Context context = 5;
  // Unix seconds after which this request must be refused.
  int64 expiry_unix = 6;
}

// Enough identity to re-derive, never enough to be believed.
message Context {
  // Mint: the Goldcoin deposit identity.
  bytes txid = 1;
  uint32 vout = 2;
  // Payout: the on-chain withdrawal index and its designated quorum
  // attempt (ADR-0015) — a responder must not sign for a superseded
  // designation.
  uint64 withdrawal_index = 3;
  uint32 quorum_attempt = 4;
}

message SignResponse {
  bytes request_id = 1;
  // The responder's validator identity (ed25519 public key).
  bytes validator_pubkey = 2;
  bytes signature = 3;
}

message HealthRequest {}

message HealthResponse {
  bytes validator_pubkey = 1;
  // The epoch this validator currently observes. Divergence between peers
  // is an alarm, not noise.
  uint64 observed_epoch = 2;
}

// A request for one designated signer's partial signature over a vault
// payout transaction (Phase 7e, ADR-0017).
//
// Goldcoin 0.17 has no PSBT and no combinerawtransaction, so partials are
// collected in parallel and the REQUESTER assembles the final scriptSig.
// Nothing here is trusted: the responder rebuilds every field from its own
// state and refuses unless the bytes match exactly.
message PayoutSignRequest {
  bytes request_id = 1;
  // The validator-set epoch the requester believes is current.
  uint64 epoch = 2;
  // Which withdrawal, and which quorum designation (ADR-0015). A responder
  // must not sign for a designation it has not itself made.
  uint64 withdrawal_index = 3;
  uint32 quorum_attempt = 4;
  // The ADR-0015 canonical payout intent. COMPARED against the responder's
  // own recomputed intent, never adopted.
  bytes canonical_intent = 5;
  // The exact unsigned transaction to sign. COMPARED against the one the
  // responder's own executor built from its own UTXO view, never adopted.
  //
  // Both this and canonical_intent are sent because they pin different
  // things: the intent fixes the economic meaning, the transaction fixes
  // the exact bytes that get signed.
  string unsigned_tx_hex = 6;
  int64 expiry_unix = 7;
}

message PayoutSignResponse {
  bytes request_id = 1;
  // The responder's federation identity (ed25519 public key).
  bytes validator_pubkey = 2;
  // The responder's VAULT key (compressed secp256k1, 33 bytes) — a
  // different key in a different cryptosystem from validator_pubkey, and
  // the one that must appear in the vault redeem script.
  bytes vault_pubkey = 3;
  // One DER-encoded signature per transaction input, in INPUT ORDER, each
  // including its trailing sighash byte exactly as it appears in a
  // scriptSig.
  //
  // These are self-authenticating: each verifies under vault_pubkey over
  // that input's sighash, which is a stronger guarantee than any
  // transport-level attestation could give.
  repeated bytes signatures = 4;
}
