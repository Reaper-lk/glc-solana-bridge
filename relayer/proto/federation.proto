syntax = "proto3";

// Federation signature exchange (Phase 7c, ADR-0016).
//
// This service moves SIGNATURES, never truth. A responder never trusts the
// requester's description of the world: it independently re-derives the
// canonical bytes from its OWN chain observations and refuses to sign
// anything that does not match byte for byte. A compromised requester
// therefore cannot induce a signature over anything the responder has not
// itself verified.
package glc.federation.v1;

service FederationSigner {
  // Requests this validator's signature over a canonical message it must
  // independently re-derive and agree with.
  rpc Sign(SignRequest) returns (SignResponse);

  // Requests this validator's PARTIAL Goldcoin signature for a vault payout
  // (Phase 7e, ADR-0017).
  //
  // Deliberately separate from Sign rather than folded into it: Sign
  // returns ONE ed25519 signature over a canonical message, while this
  // returns ONE DER-encoded secp256k1 ECDSA signature PER TRANSACTION INPUT
  // over Goldcoin sighashes. Overloading one response shape to mean both
  // would remove the type system's help exactly where the two must never be
  // confused.
  rpc SignPayout(PayoutSignRequest) returns (PayoutSignResponse);

  // Requests this validator's ed25519 signature attesting that a
  // withdrawal was paid on Goldcoin (Phase 7f, ADR-0018).
  //
  // Distinct from Sign because the responder must verify a GOLDCOIN fact —
  // that a specific payout is confirmed at depth — before it will sign,
  // which is a different check from re-deriving a deposit claim.
  rpc SignCompletion(CompletionSignRequest) returns (CompletionSignResponse);

  // Requests this validator's ed25519 signature over a GOVERNANCE message
  // (Phase 7i-0).
  //
  // Unlike every other method here, the responder cannot DERIVE whether it
  // agrees: "should the federation rotate to this set?" has no on-chain
  // answer. It signs only what its own operator has explicitly staged as an
  // approval, so M signatures mean M operators each decided, rather than M
  // processes agreeing with whoever asked first.
  rpc SignGovernance(GovernanceSignRequest) returns (GovernanceSignResponse);

  // Requests this validator's PARTIAL Goldcoin signatures for a VAULT SWEEP
  // — moving the entire vault to a new one (Phase 7i-0, ADR-0014 §8.7).
  //
  // Separate from SignPayout even though both return partial signatures
  // over the same vault key, because the authorisation differs completely:
  // a payout is authorised by a burn on Solana, a sweep only by the
  // responder's own operator having staged it. One path where the stronger
  // condition could be reached through the weaker check is exactly the
  // mistake this separation prevents.
  rpc SignSweep(SweepSignRequest) returns (SweepSignResponse);

  // Liveness and identity probe, used to decide quorum availability BEFORE
  // designating one (ADR-0015: reassignment must be explicit, so the
  // executor prefers to designate a quorum it believes is reachable).
  rpc Health(HealthRequest) returns (HealthResponse);
}

// What is being asked for. Action discriminants match the on-chain
// canonical-message action bytes so a signature can never be repurposed
// across action types.
enum Action {
  ACTION_UNSPECIFIED = 0;   // never valid
  ACTION_MINT_DEPOSIT = 1;  // shared::claim::ACTION_MINT_DEPOSIT
  ACTION_PAYOUT = 2;        // Goldcoin vault payout (ADR-0015 intent)
  ACTION_GOVERNANCE = 3;    // shared::governance
}

message SignRequest {
  // Unique per request; makes a retry distinguishable from a fresh ask.
  bytes request_id = 1;
  Action action = 2;
  // The validator-set epoch the requester believes is current. A responder
  // whose own view disagrees refuses rather than signing under a stale
  // federation.
  uint64 epoch = 3;
  // The exact bytes the requester wants signed. CHECKED, never trusted:
  // the responder re-derives them and compares.
  bytes canonical_message = 4;
  // Identifiers letting the responder locate the same facts in its own
  // state in order to re-derive `canonical_message`.
  Context context = 5;
  // Unix seconds after which this request must be refused.
  int64 expiry_unix = 6;
}

// Enough identity to re-derive, never enough to be believed.
message Context {
  // Mint: the Goldcoin deposit identity.
  bytes txid = 1;
  uint32 vout = 2;
  // Payout: the on-chain withdrawal index and its designated quorum
  // attempt (ADR-0015) — a responder must not sign for a superseded
  // designation.
  uint64 withdrawal_index = 3;
  uint32 quorum_attempt = 4;
}

message SignResponse {
  bytes request_id = 1;
  // The responder's validator identity (ed25519 public key).
  bytes validator_pubkey = 2;
  bytes signature = 3;
}

message HealthRequest {}

message HealthResponse {
  bytes validator_pubkey = 1;
  // The epoch this validator currently observes. Divergence between peers
  // is an alarm, not noise.
  uint64 observed_epoch = 2;
}

// A request for one designated signer's partial signature over a vault
// payout transaction (Phase 7e, ADR-0017).
//
// Goldcoin 0.17 has no PSBT and no combinerawtransaction, so partials are
// collected in parallel and the REQUESTER assembles the final scriptSig.
// Nothing here is trusted: the responder rebuilds every field from its own
// state and refuses unless the bytes match exactly.
message PayoutSignRequest {
  bytes request_id = 1;
  // The validator-set epoch the requester believes is current.
  uint64 epoch = 2;
  // Which withdrawal, and which quorum designation (ADR-0015). A responder
  // must not sign for a designation it has not itself made.
  uint64 withdrawal_index = 3;
  uint32 quorum_attempt = 4;
  // The ADR-0015 canonical payout intent. COMPARED against the responder's
  // own recomputed intent, never adopted.
  bytes canonical_intent = 5;
  // The exact unsigned transaction to sign. COMPARED against the one the
  // responder's own executor built from its own UTXO view, never adopted.
  //
  // Both this and canonical_intent are sent because they pin different
  // things: the intent fixes the economic meaning, the transaction fixes
  // the exact bytes that get signed.
  string unsigned_tx_hex = 6;
  int64 expiry_unix = 7;
  // Which operator is proposing (Phase 7g, ADR-0019 D3 check 1).
  //
  // ADVISORY, and deliberately so: it decides only whether this proposal is
  // TIMELY — whether the designated builder is the one asking, or its
  // failover window has elapsed. It is NOT a security boundary. Every field
  // of the proposal is independently validated against the responder's own
  // state regardless of who claims to have sent it, so a false value can
  // waste a round trip and nothing more.
  uint32 proposer_index = 8;
}

message PayoutSignResponse {
  bytes request_id = 1;
  // The responder's federation identity (ed25519 public key).
  bytes validator_pubkey = 2;
  // The responder's VAULT key (compressed secp256k1, 33 bytes) — a
  // different key in a different cryptosystem from validator_pubkey, and
  // the one that must appear in the vault redeem script.
  bytes vault_pubkey = 3;
  // One DER-encoded signature per transaction input, in INPUT ORDER, each
  // including its trailing sighash byte exactly as it appears in a
  // scriptSig.
  //
  // These are self-authenticating: each verifies under vault_pubkey over
  // that input's sighash, which is a stronger guarantee than any
  // transport-level attestation could give.
  repeated bytes signatures = 4;
}

// A request for one validator's attestation that a withdrawal was paid
// (Phase 7f, ADR-0018).
//
// Completion is TERMINAL on-chain, so nothing here is trusted: the
// responder checks the payout against its own Goldcoin node at the
// configured confirmation depth and refuses anything it cannot confirm.
message CompletionSignRequest {
  bytes request_id = 1;
  uint64 epoch = 2;
  uint64 withdrawal_index = 3;
  // The Goldcoin payout being attested, in INTERNAL byte order (as it
  // appears in the canonical message), and the height it was mined at.
  // Both are COMPARED against the responder's own observation.
  bytes payout_txid = 4;
  uint64 payout_height = 5;
  int64 expiry_unix = 6;
}

message CompletionSignResponse {
  bytes request_id = 1;
  bytes validator_pubkey = 2;
  // ed25519 signature over the canonical completion message the responder
  // built from ITS OWN state — never from the request.
  bytes signature = 3;
}

// A request for one signer's partial signatures over a vault sweep
// (Phase 7i-0).
//
// Deliberately minimal. It carries the transaction and nothing else: no
// amounts, no destination label, no input descriptions. Every one of those
// is read from the responder's OWN vault_utxos rows, so there is no field
// here a proposer could use to influence what the sweep is worth.
message SweepSignRequest {
  bytes request_id = 1;
  uint64 epoch = 2;
  // The exact unsigned transaction to sign. The responder rebuilds the
  // sweep plan from this plus its own UTXO view, recomputes the commitment,
  // and refuses unless its operator staged that exact commitment.
  string unsigned_tx_hex = 3;
  int64 expiry_unix = 4;
}

message SweepSignResponse {
  bytes request_id = 1;
  bytes validator_pubkey = 2;
  // The responder's VAULT key (compressed secp256k1, 33 bytes).
  bytes vault_pubkey = 3;
  // One DER-encoded signature per input, in INPUT ORDER, each including its
  // trailing sighash byte exactly as it appears in a scriptSig.
  repeated bytes signatures = 4;
}

// A request for one validator's governance signature (Phase 7i-0).
message GovernanceSignRequest {
  bytes request_id = 1;
  // The validator-set epoch the requester believes is current. A governance
  // signature must not outlive the federation revision it was made under.
  uint64 epoch = 2;
  // Governance action byte from shared::governance (0x03 rotation,
  // 0x04 cancel, 0x05 TVL raise). Anything else is refused.
  uint32 action = 3;
  // SHA-256 over the canonical parameter bytes — the same commitment the
  // on-chain program recomputes. The responder compares it against what its
  // operator approved, byte for byte.
  bytes params_commitment = 4;
  int64 expiry_unix = 5;
}

message GovernanceSignResponse {
  bytes request_id = 1;
  bytes validator_pubkey = 2;
  // ed25519 signature over the canonical governance message the responder
  // built from ITS OWN configuration and observed epoch — never from the
  // request.
  bytes signature = 3;
}
