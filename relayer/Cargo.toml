[package]
name = "glc-relayer"
description = "Off-chain federated validator daemon for the GLC<->Solana bridge — Phase 0 placeholder"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Reaper-lk/glc-solana-bridge"
# Never published to crates.io (also lets cargo-deny's allow-wildcard-paths
# accept the versionless path dependency on `shared`).
publish = false

# This crate is its OWN workspace root (empty [workspace] below), detached
# from the repository root workspace on purpose: its async/networking
# dependency graph must never unify with the on-chain (SBF) build.
# See docs/adr/0001-repo-layout-and-workspace-split.md.
[workspace]

[dependencies]
glc-bridge-shared = { path = "../shared" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
# Goldcoin JSON-RPC client (Phase 4). No bitcoincore-rpc: Goldcoin's RPC
# shapes diverge from modern Bitcoin Core (docs/goldcoin-rpc-notes.md), so a
# thin hand-rolled client against reqwest is safer than trusting a crate
# tuned for current Bitcoin Core semantics.
# native-roots (not the default rustls-tls, which bundles Mozilla's list via
# webpki-roots under a CDLA-Permissive-2.0 data license not in deny.toml's
# allow-list) uses the OS's own trusted CA store — pure-Rust TLS, no OpenSSL
# dependency, and the more correct choice for RPC endpoints anyway.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Embedded, transactional persistence for the indexer (ADR-0011, decision U1).
rusqlite = { version = "0.31", features = ["bundled"] }
# message_hash fingerprint in claim_artifacts (Phase 4); off-chain only, no
# SBF constraint applies here (unlike the shared crate).
sha2 = "0.10"

# Solana side (Phase 5). Resolved to 2.3.x — newer than the 2.1.21 Agave
# line pinned for the on-chain SBF toolchain (Anchor.toml), because exact
# 2.1.21 pinning here would require cascading precise-pins through many
# solana-client sub-crates for no real benefit: unlike the SBF program, this
# is a host-side JSON-RPC client, not something the Agave platform-tools
# compiler builds, so exact patch-version match isn't a hard constraint the
# way it is on-chain. Compatibility against the actual pinned
# solana-test-validator 2.1.21 binary is verified empirically by
# `relayer/tests/local_validator_e2e.rs`, not assumed from version numbers.
#
# The relayer does NOT depend on the on-chain `glc-bridge` crate itself
# (owner decision R1, ADR-0012): the mint_wrapped instruction is hand-built
# here (discriminator + Borsh args + raw account metas) to keep this
# workspace genuinely independent of anchor-lang, matching ADR-0001's
# isolation intent.
solana-sdk = "2.1"
solana-client = "2.1"
# Pure address-derivation math (no SBF/Anchor coupling) for the recipient's
# associated token account, and the well-known SPL Token program id
# constant (classic Token program — owner decision U5, Phase 2).
spl-associated-token-account = "4"
spl-token = "6"
# Types-only crate, ALREADY in the tree via solana-pubsub-client — declaring
# it directly adds nothing new to the dependency graph. Needed because
# getProgramAccounts defaults to base58 encoding, which the node refuses for
# accounts over 128 bytes (a WithdrawalRequest is 180).
solana-account-decoder-client-types = "2.3"

[dev-dependencies]
tempfile = "3"
