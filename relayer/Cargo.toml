[package]
name = "glc-relayer"
description = "Off-chain federated validator daemon for the GLC<->Solana bridge — Phase 0 placeholder"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Reaper-lk/glc-solana-bridge"
# Never published to crates.io (also lets cargo-deny's allow-wildcard-paths
# accept the versionless path dependency on `shared`).
publish = false

# This crate is its OWN workspace root (empty [workspace] below), detached
# from the repository root workspace on purpose: its async/networking
# dependency graph must never unify with the on-chain (SBF) build.
# See docs/adr/0001-repo-layout-and-workspace-split.md.
[workspace]

[dependencies]
glc-bridge-shared = { path = "../shared" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
# Goldcoin JSON-RPC client (Phase 4). No bitcoincore-rpc: Goldcoin's RPC
# shapes diverge from modern Bitcoin Core (docs/goldcoin-rpc-notes.md), so a
# thin hand-rolled client against reqwest is safer than trusting a crate
# tuned for current Bitcoin Core semantics.
# native-roots (not the default rustls-tls, which bundles Mozilla's list via
# webpki-roots under a CDLA-Permissive-2.0 data license not in deny.toml's
# allow-list) uses the OS's own trusted CA store — pure-Rust TLS, no OpenSSL
# dependency, and the more correct choice for RPC endpoints anyway.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Embedded, transactional persistence for the indexer (ADR-0011, decision U1).
rusqlite = { version = "0.31", features = ["bundled"] }
# message_hash fingerprint in claim_artifacts (Phase 4); off-chain only, no
# SBF constraint applies here (unlike the shared crate).
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

# Added in later phases (NOT Phase 0):
#   Phase 5: solana-client / solana-sdk (version matched to the Anchor line),
#            clap + config loading, p2p transport
