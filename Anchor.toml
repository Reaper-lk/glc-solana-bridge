# Anchor CLI configuration. Phase 0: localnet only, nothing is deployed.

[toolchain]
anchor_version = "0.31.1"
# Verified pairing (Phase 1): Anchor 0.31.1 <-> Agave 2.1.21 <-> rustc 1.85.0
# (host). The SBF build uses Agave's bundled platform-tools (cargo 1.79), which
# cannot parse edition-2024 manifests — the committed Cargo.lock pins the
# dependency graph to versions that predate that requirement. Bump this pin and
# the lockfile together.
solana_version = "2.1.21"

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Placeholder ID (deterministically generated, no known private key).
# Replaced via `anchor keys sync` when a real deploy keypair exists.
glc_bridge = "77oYT33t13HnZ6PNxKdbHDABb1uR2zzJMW9u7cJuwkRq"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "echo 'E2E harness lands in Phase 6 — see docs/architecture.md (implementation phases)'"
