[package]
name = "glc-bridge-shared"
description = "Types shared between the glc-bridge Anchor program and the off-chain relayer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Never published to crates.io.
publish = false

[lints]
workspace = true

# RULES for this crate (enforced by membership in the on-chain workspace,
# which CI builds for SBF):
#   - no async runtimes, no networking, no filesystem, no randomness
#   - everything here must compile under the Solana SBF target
#
# Phase 0: deliberately dependency-free. Serialization derives (borsh, and
# serde behind an off-chain-only feature) are added in Phase 1 once the borsh
# version is locked to the one anchor-lang re-exports — a mismatch there
# silently diverges on-chain and off-chain byte layouts.
[dependencies]
